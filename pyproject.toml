[build-system]
requires = [
    "scikit-build-core >=1.1.0",
    "nanobind >=3.1.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "py_brill_rcnp2025"
version = "0.1.0"
description = "Python bindings for brill_rcnp2025"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "kinstaky" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"
# Setuptools-style build caching in a local directory
build-dir = "build"
build.targets = ["_bindings"]
# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp314"
# python package
wheel.packages = ["python/py_brill_rcnp2025"]

[tool.cibuildwheel]
# Necessary to see build output from the actual compilation
build-verbosity = 1

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cpp/**/CMakeLists.txt" },
    { file = "bindings/**/CMakeLists.txt" },
    { file = "cpp/**/*.cpp" },
    { file = "bindings/**/*.cpp" },
    # { file = "python/**/*.py" },
]
